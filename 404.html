  <style>:root{--color-bg:#fdf3e7;--color-surface:#fffdf9;--color-surface-muted:#f6e7d4;--color-text:#3a2a18;--color-text-muted:#8f7350;--color-border:#e6c9a3;--color-border-soft:#f0ddd0;--color-accent:#b45309;--color-accent-soft:#fde7d3;--color-accent-contrast:#ffffff;--color-focus:#b45309;--color-overlay:rgba(58, 42, 24, .55);--color-shadow:rgba(180, 83, 9, .12);color-scheme:light}*,*:before,*:after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background-color:var(--color-bg)}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;background-color:var(--color-bg);color:var(--color-text);transition:background-color .2s ease,color .2s ease;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}html,body{overflow-x:hidden}</style><link rel="stylesheet" href="styles-QXUJZCDG.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-QXUJZCDG.css"></noscript></head>
  <body>
    <app-root></app-root>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
      (function ajustarVlibras() {
        var wrapper = document.getElementById('vlibras-access-wrapper');
        if (wrapper && wrapper.shadowRoot) {
          var style = document.createElement('style');
          style.textContent = [
            '#vlibras-access { top: auto !important; bottom: 88px !important; right: 14px !important; left: auto !important; }',
            '@media (min-width: 768px) { #vlibras-access { bottom: 24px !important; right: 24px !important; } }',
          ].join('\n');
          wrapper.shadowRoot.appendChild(style);
        } else {
          setTimeout(ajustarVlibras, 200);
        }
      })();
    </script>
  <script src="main-RBBAWEQ7.js" type="module"></script></body>
