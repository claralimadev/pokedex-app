<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Pokédex</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
      (function ajustarVlibras() {
        var wrapper = document.getElementById('vlibras-access-wrapper');
        if (wrapper && wrapper.shadowRoot) {
          var style = document.createElement('style');
          style.textContent = [
            '#vlibras-access { top: auto !important; bottom: 88px !important; right: 14px !important; left: auto !important; }',
            '@media (min-width: 768px) { #vlibras-access { bottom: 24px !important; right: 24px !important; } }',
          ].join('\n');
          wrapper.shadowRoot.appendChild(style);
        } else {
          setTimeout(ajustarVlibras, 200);
        }
      })();
    </script>
  </body>
</html>
